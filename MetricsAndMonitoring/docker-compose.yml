services:
  orderservice:
    build:
      context: .
      dockerfile: OrderServiceApi/Dockerfile
    ports:
      - "9092:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - PaymentService__BaseUrl=http://paymentservice
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://ops.seq:5341/ingest/otlp/v1/traces
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    volumes:
      - sqlite_data_orderservice:/app/data
    depends_on:
      - paymentservice
      - ops.seq
    networks:
      - ops

  paymentservice:
    build:
      context: .
      dockerfile: PaymentServiceApi/Dockerfile
    ports:
      - "9093:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://ops.seq:5341/ingest/otlp/v1/traces
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    volumes:
      - sqlite_data_paymentservice:/app/data
    depends_on:
      - ops.seq
    networks:
      - ops

  ops.seq:
    image: datalust/seq:latest
    container_name: Ops.Seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    volumes:
      - ./containers/seq:/data
    ports:
      - "8081:80"
    networks:
      - ops

networks:
  ops:
    driver: bridge

volumes:
  sqlite_data_orderservice: {}
  sqlite_data_paymentservice: {}